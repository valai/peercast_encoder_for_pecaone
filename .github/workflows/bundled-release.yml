name: Add portable v1.0.0 package

on:
  push:
    branches: [codex/change-paring-label]
    paths:
      - .github/workflows/bundled-release.yml
      - scripts/ffmpeg/**
      - scripts/Build-BundledPackage.ps1
      - tests/PecaOneRelay.Tests/RelayTests.cs

permissions:
  contents: read

concurrency:
  group: portable-v1.0.0
  cancel-in-progress: true

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev nasm make pkg-config curl git xz-utils zip
      - name: Build binaries and corresponding source
        run: bash scripts/ffmpeg/build-win-x64.sh "$RUNNER_TEMP/ffmpeg-build" "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-from-source
          path: |
            artifacts/ffmpeg-win-x64
            artifacts/FFmpeg-9.0.2-x264-source.zip
          retention-days: 14
          if-no-files-found: error
  package:
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-from-source
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Test the source-built Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path vendor/ffmpeg -Force | Out-Null
          Copy-Item -Path artifacts/ffmpeg-win-x64/* -Destination vendor/ffmpeg -Recurse -Force
          ./scripts/build.ps1 -TestOnly
      - name: Add FFmpeg to the verified v1.0.0 application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/valai/peercast_encoder_for_pecaone/releases/download/v1.0.0/PecaOneConnect-v1.0.0-win-x64.zip' -OutFile publish/PecaOneConnect-v1.0.0-win-x64.zip -TimeoutSec 180
          ./scripts/Build-BundledPackage.ps1
      - name: Attach the portable package and source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $assets = @('publish/PecaOneConnect-v1.0.0-portable-win-x64.zip', 'publish/FFmpeg-9.0.2-x264-source.zip', 'publish/SHA256SUMS-portable.txt')
          gh release upload v1.0.0 @assets --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Portable asset upload failed. Existing files were not overwritten.' }
          $release = gh release view v1.0.0 --repo $repo --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft) { throw 'Release verification failed.' }
          foreach ($asset in $assets) {
            $file = Get-Item -LiteralPath $asset
            $uploaded = @($release.assets | Where-Object { $_.name -eq $file.Name })
            if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne $file.Length) { throw ('Asset verification failed: ' + $file.Name) }
          }
          gh release edit v1.0.0 --repo $repo --notes-file docs/RELEASE-v1.0.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
